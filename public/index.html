<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Bunk the Chaos, Keep the Fun!"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>BunkMates</title>

    <meta name="title" content="BunkMates — Your Smart Trip Companion" />
    <meta name="description" content="Plan, chat, manage budgets, and explore together — all in one seamless app for travelers and friends." />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bunk-mates.vercel.app/" />
    <meta property="og:title" content="BunkMates — Your Smart Trip Companion" />
    <meta property="og:description" content="Plan, chat, manage budgets, and explore together — all in one seamless app for travelers and friends." />
    <meta property="og:image" content="https://bunk-mates.vercel.app/meta/preview.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://bunk-mates.vercel.app/" />
    <meta property="twitter:title" content="BunkMates — Your Smart Trip Companion" />
    <meta property="twitter:description" content="Plan, chat, manage budgets, and explore together — all in one seamless app for travelers and friends." />
    <!-- Pre-load Critical Theme Styles & Eliminate White Flash on Refresh -->
    <style>
      html, body {
        background-color: #0c0c0c;
        color: #ffffff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        min-height: 100vh;
        background-color: inherit;
      }
    </style>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem("bunkmate_theme_mode") || "dark";
          var bg = mode === "light" ? "#f1f1f1" : "#0c0c0c";
          var color = mode === "light" ? "#111111" : "#ffffff";
          document.documentElement.style.backgroundColor = bg;
          document.documentElement.style.color = color;
          if (document.body) {
            document.body.style.backgroundColor = bg;
            document.body.style.color = color;
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body style="background-color: #0c0c0c; color: #ffffff;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
